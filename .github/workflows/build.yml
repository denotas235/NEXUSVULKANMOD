name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        java: [
          21,
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: verify JAR contents
        if: ${{ matrix.java == '21' }}
        run: |
          JAR=$(ls build/libs/VulkanMod_*.jar | grep -v sources | head -1)
          echo "=== Output JAR: $JAR ==="
          if [ ! -f "$JAR" ]; then
            echo "❌ No output JAR found"
            exit 1
          fi
          echo "✅ JAR exists: $(du -sh "$JAR" | cut -f1)"
          echo ""
          echo "--- JSON files in JAR ---"
          unzip -l "$JAR" | grep "\.json"
          echo ""
          # Loom 1.13+ remaps @Shadow/@Inject annotation values directly in
          # remapJar via tiny-remapper; no separate refmap file is generated.
          # Verify the mixin config is present instead.
          if ! unzip -l "$JAR" | grep -q "vulkanmod.mixins.json"; then
            echo "❌ vulkanmod.mixins.json missing from JAR"
            exit 1
          fi
          echo "✅ vulkanmod.mixins.json present in JAR"

      - name: capture build artifacts
        if: ${{ matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
