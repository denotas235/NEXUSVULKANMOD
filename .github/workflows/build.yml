name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        java: [
          21,
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: verify JAR contents
        if: ${{ matrix.java == '21' }}
        run: |
          JAR=$(ls build/libs/VulkanMod_*.jar | grep -v sources | head -1)
          echo "=== Output JAR: $JAR ==="
          if [ ! -f "$JAR" ]; then
            echo "❌ No output JAR found"
            exit 1
          fi
          echo "✅ JAR exists: $(du -sh "$JAR" | cut -f1)"
          echo ""
          echo "--- JSON files in JAR ---"
          unzip -l "$JAR" | grep "\.json"
          echo ""
          if ! unzip -l "$JAR" | grep -q "vulkanmod.mixins.json"; then
            echo "❌ vulkanmod.mixins.json missing from JAR"
            exit 1
          fi
          echo "✅ vulkanmod.mixins.json present in JAR"
          echo ""
          echo "--- LWJGL jars embedded ---"
          unzip -l "$JAR" | grep "META-INF/jars" || echo "(none)"
          echo ""
          # Copy JAR to a predictable output path
          cp "$JAR" build/libs/VulkanMod.jar

      - name: upload mod JAR
        if: ${{ matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod
          path: build/libs/VulkanMod.jar
          if-no-files-found: error
