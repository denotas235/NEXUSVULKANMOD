name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        java: [
          21,
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: validate refmap in JAR
        if: ${{ matrix.java == '21' }}
        run: |
          JAR=$(ls build/libs/VulkanMod_*.jar | grep -v sources | head -1)
          echo "Checking JAR: $JAR"
          if ! unzip -l "$JAR" | grep -q "vulkanmod.refmap.json"; then
            echo "❌ vulkanmod.refmap.json NOT found in $JAR"
            echo "Mixin @Shadow fields using Mojang names will fail at runtime."
            exit 1
          fi
          SIZE=$(unzip -p "$JAR" vulkanmod.refmap.json | wc -c)
          if [ "$SIZE" -lt 10 ]; then
            echo "❌ vulkanmod.refmap.json is empty (size=${SIZE} bytes)"
            exit 1
          fi
          echo "✅ vulkanmod.refmap.json present and non-empty (${SIZE} bytes)"

      - name: capture build artifacts
        if: ${{ matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
