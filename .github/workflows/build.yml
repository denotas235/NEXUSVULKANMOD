name: CI — Build & Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Job 1 — Compile + package
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # ── Verify JAR has all required files ──────────────────────────────
      - name: Verify JAR contents
        run: |
          JAR=$(ls build/libs/VulkanMod_*.jar 2>/dev/null | grep -v sources | head -1)
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "::error::No output JAR produced"; exit 1
          fi
          echo "JAR: $JAR  ($(du -sh "$JAR" | cut -f1))"
          echo ""

          # Diagnostic: list ALL JSON files in the JAR
          # NOTE: Loom 1.13 new AP embeds mixin remapping data directly into
          # class bytecode during remapJar — no separate *-refmap.json is
          # written to the JAR. This is expected & correct.
          echo "=== JSON files in JAR ==="
          unzip -l "$JAR" | grep "\.json" || echo "  (no JSON files)"
          echo ""

          # Check required files
          MISSING=0
          for f in vulkanmod.mixins.json fabric.mod.json; do
            if unzip -l "$JAR" | grep -q "$f"; then
              echo "✓ $f"
            else
              echo "::error::$f MISSING from JAR"
              MISSING=1
            fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1

          # Show embedded LWJGL JARs (ZalithLauncher2 runtime)
          echo ""
          echo "Embedded JARs:"
          unzip -l "$JAR" | grep "META-INF/jars/" || echo "  (none)"

          cp "$JAR" build/libs/VulkanMod.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod
          path: build/libs/VulkanMod.jar
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2 — Headless Mixin validation (no GPU required)
  # ══════════════════════════════════════════════════════════════════════════
  mixin-validate:
    name: Mixin validation (headless)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      # Run the Fabric loader headless with skip_vulkan guard.
      # All Mixins are applied before Vulkan init, so any @Shadow resolution
      # failure or VerifyError is fatal and appears in game.log first.
      - name: Run headless Mixin load
        timeout-minutes: 5
        run: |
          mkdir -p run
          Xvfb :99 -screen 0 640x480x24 &
          DISPLAY=:99 ./gradlew runClient \
            --no-daemon \
            -Dvulkanmod.test.skip_vulkan=true \
            -Djava.awt.headless=true \
            2>&1 | tee run/game.log || true

      - name: Analyse game log for Mixin errors
        run: python3 .github/scripts/analyse_log.py run/game.log

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3 — Final release JAR (only if both jobs pass)
  # ══════════════════════════════════════════════════════════════════════════
  release-jar:
    name: Final release JAR
    needs: [build, mixin-validate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build final JAR
        run: ./gradlew build --no-daemon

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-release
          path: build/libs/VulkanMod_*.jar
          if-no-files-found: error
          exclude: "**/*-sources.jar"
